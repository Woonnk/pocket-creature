name: Publish beta or prepare stable release
on:
  push:
    branches: [main]
    tags: ['v0.*', 'v1.*']
permissions:
  contents: read
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate explicit release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: node -e "const p=require('./package.json');if(!/^[01]\.\d+\.\d+$/.test(p.version)||(process.env.RELEASE_REF_TYPE==='tag'?process.env.RELEASE_TAG!=='v'+p.version:!/^0\./.test(p.version)))throw Error('Tag/package version mismatch or unsupported publication');"
      - run: npm ci
      - run: npm test
      - shell: powershell
        run: ./scripts/verify-windows-helper.ps1
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: npm run dist:win
      - run: npm run check:release
      - run: npm run release:assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/assets/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish beta or create stable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == 0.* ]]; then
            gh release create "v$VERSION" release-assets/* --target "$RELEASE_COMMIT" --prerelease --title "Pocket Creature $VERSION — public beta" --notes-file RELEASE_NOTES.md
          else
            gh release create "v$VERSION" release-assets/* --draft --verify-tag --title "Pocket Creature $VERSION" --notes-file RELEASE_NOTES.md
          fi
